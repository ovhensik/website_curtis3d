    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Curtis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stompy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #0054FE;
        }

        body {
            font-family: 'Stompy', monospace;
            background: #0054FE;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            text-align: center;
            width: min(100%, 1600px);
            padding-top: 40px;
        }

        .project-video {
            display: block;
            width: min(1280px, 95vw);
            height: auto;
            margin: 0 auto 18px;
        }

        .clothing-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            width: min(1280px, 95vw);
            margin: 0 auto 42px;
            align-items: start;
        }

        .clothing-image-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
        }

        .clothing-gallery img,
        .clothing-gallery video {
            display: block;
            width: 100%;
            height: auto;
        }

        .image-dialog {
            width: fit-content;
            max-width: 90vw;
            max-height: 90vh;
            margin: auto;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .image-dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
        }

        .image-dialog img {
            display: block;
            max-width: 100%;
            max-height: 90vh;
            margin: auto;
            object-fit: contain;
        }

        .image-dialog-close {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 8px 12px;
            border: 0;
            color: #fff;
            background: #0054FE;
            font: inherit;
            cursor: pointer;
        }

        .project-title {
            color: #f8f9fa;
            font-size: 2em;
            line-height: 1.2;
            margin: 72px auto 16px;
        }

        @media (max-height: 1080px) and (min-width: 701px) {
            .project-video {
                width: min(1280px, 95vw, 110vh);
            }
        }

        .project-caption {
            color: #bdc3c7;
            font-size: 1em;
            line-height: 1.2;
            margin: 0 auto 42px;
            padding: 0 12px;
        }

        h1 {
            font-size: 4em;
            line-height: 1.2;
            color: #f8f9fa;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .tagline {
            font-size: 1.2em;
            line-height: 1.2;
            color: #bdc3c7;
            margin-top: -20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            line-height: 1.2;
            text-decoration: none;
            color: #000eff;
            background: #fff;
            border-radius: 0;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: none;
        }

        .btn:hover {
            background: #f5f7ff;
            color: #000eff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        @media (max-height: 1000px) and (min-width: 701px) {
            h1 {
                margin-bottom: 18px;
            }

            .tagline {
                margin-bottom: 18px;
            }

            .buttons {
                margin-top: 15px;
            }
        }

        @media (max-width: 700px) {
            h1 {
                font-size: clamp(2.5rem, 13.5vw, 4em);
            }

            .clothing-gallery {
                grid-template-columns: 1fr;
                width: min(100%, 520px);
            }

            .buttons {
                gap: 8px;
            }

            .btn {
                padding: 12px 8px;
                font-size: clamp(0.8rem, 4vw, 1.1em);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="intro">
            <h1>David Curtis</h1>
            <p class="tagline">3D Hard Surface Artist. I create technical tools.<br>Design and AI-Assisted Product Visualization</p>
            <div class="buttons">
                <a href="https://www.artstation.com/davidcurtis/" target="_blank" class="btn">3D Portfolio</a>
                <a href="https://github.com/ovhensik" target="_blank" class="btn">Github</a>
                <a href="David_Curtis_Resume.pdf" class="btn">Resume</a>
            </div>
        </div>
        <h2 class="project-title">Product Visualization</h2>
        <video class="project-video" width="1280" height="704" autoplay muted loop playsinline controls preload="metadata">
            <source src="ferrari-video.mp4" type="video/mp4">
        </video>
        <p class="project-caption">AI prompted with LTX 2.5 local model in ComfyUI and edited in FilmCraft</p>
        <section aria-labelledby="clothing-title">
            <h2 id="clothing-title" class="project-title">Clothing</h2>
            <div class="clothing-gallery">
                <button class="clothing-image-button" type="button">
                    <img src="jacket_02.png" alt="Blue and navy jacket displayed on a hanger">
                </button>
                <button class="clothing-image-button" type="button">
                    <img src="jacket_01.png" alt="Close-up of the jacket's collar and patterned blue fabric">
                </button>
                <video autoplay muted loop controls playsinline preload="metadata">
                    <source src="jacket_video_01.mp4" type="video/mp4">
                </video>
            </div>
        </section>
    </div>
    <dialog class="image-dialog" aria-label="Enlarged clothing image">
        <button class="image-dialog-close" type="button">Close</button>
        <img alt="">
    </dialog>
    <script>
        const imageDialog = document.querySelector('.image-dialog');
        const enlargedImage = imageDialog.querySelector('img');

        document.querySelectorAll('.clothing-image-button').forEach((button) => {
            button.addEventListener('click', () => {
                const image = button.querySelector('img');
                enlargedImage.src = image.src;
                enlargedImage.alt = image.alt;
                imageDialog.showModal();
            });
        });

        imageDialog.querySelector('.image-dialog-close').addEventListener('click', () => {
            imageDialog.close();
        });

        imageDialog.addEventListener('click', (event) => {
            if (event.target === imageDialog) {
                imageDialog.close();
            }
        });
    </script>
</body>
</html>
