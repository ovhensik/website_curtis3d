    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Curtis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stompy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Stompy', monospace;
            background: #000cfd;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
        }

        .intro {
            transform: translateY(-20px);
        }

        .hero-video {
            display: block;
            width: min(320px, 61vw);
            height: auto;
            aspect-ratio: 1080 / 1520;
            object-fit: contain;
            margin: 0 auto 10px;
            mix-blend-mode: lighten;
            transform: translateY(-110px) scale(1.4);
            transform-origin: center bottom;
        }

        h1 {
            font-size: 4em;
            line-height: 1.2;
            color: #f8f9fa;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .tagline {
            font-size: 1.2em;
            line-height: 1.2;
            color: #bdc3c7;
            margin-top: -20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            line-height: 1.2;
            text-decoration: none;
            color: #000cfd;
            background: #fff;
            border-radius: 0;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: none;
        }

        .btn:hover {
            background: #fff;
            color: #000cfd;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <video class="hero-video" width="1080" height="1520" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
            <source src="hero-video.mp4" type="video/mp4">
        </video>
        <div class="intro">
            <h1>David Curtis</h1>
            <p class="tagline">3D Hard Surface Artist and I create tools for fun</p>
            <div class="buttons">
                <a href="https://www.artstation.com/davidcurtis/" target="_blank" class="btn">Portfolio</a>
                <a href="https://github.com/ovhensik" target="_blank" class="btn">Github</a>
                <a href="David_Curtis_Resume.pdf" class="btn">Resume</a>
            </div>
        </div>
    </div>
</body>
</html>
