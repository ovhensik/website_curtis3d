    
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Curtis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stompy&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background: #000;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Stompy', monospace;
            background: transparent;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            width: min(100%, 1600px);
            margin: 0 auto;
        }

        .page-section {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 0;
            scroll-snap-align: start;
            scroll-snap-stop: always;
        }

        .intro-section {
            position: relative;
            isolation: isolate;
            background-image: url("ascii_jacket_01.png");
            background-position: center;
            background-size: auto 100%;
            background-repeat: no-repeat;
        }

        .intro-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 0;
            background: rgba(0, 0, 0, var(--intro-fade, 0));
            pointer-events: none;
        }

        .intro {
            position: relative;
            z-index: 1;
        }

        .page-indicators {
            position: fixed;
            bottom: 24px;
            left: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 10px;
            transform: translateX(-50%);
        }

        .page-indicator {
            display: block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(248, 249, 250, 0.35);
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .page-indicator[aria-current="page"] {
            background: #f8f9fa;
            transform: scale(1.25);
        }

        .page-indicator:focus-visible {
            outline: 2px solid #f8f9fa;
            outline-offset: 4px;
        }

        .project-video {
            display: block;
            width: min(1280px, 95vw);
            height: auto;
            margin: 0 auto 18px;
        }

        .clothing-gallery {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            width: min(1280px, 95vw);
            margin: 0 auto;
            align-items: start;
        }

        .clothing-image-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: none;
            cursor: zoom-in;
        }

        .clothing-gallery img,
        .clothing-gallery video {
            display: block;
            width: 100%;
            height: auto;
            max-height: 58vh;
            object-fit: contain;
        }

        .image-dialog {
            width: fit-content;
            max-width: 90vw;
            max-height: 90vh;
            margin: auto;
            padding: 0;
            border: 0;
            background: transparent;
        }

        .image-dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
        }

        .image-dialog img {
            display: block;
            max-width: 100%;
            max-height: 90vh;
            margin: auto;
            object-fit: contain;
        }

        .image-dialog-close {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 8px 12px;
            border: 0;
            color: #fff;
            background: #174edb;
            font: inherit;
            cursor: pointer;
        }

        .project-title {
            color: #f8f9fa;
            font-size: 2em;
            line-height: 1.2;
            margin: 0 auto 16px;
        }

        @media (max-height: 1080px) and (min-width: 701px) {
            .project-video {
                width: min(1280px, 95vw, 110vh);
            }
        }

        .project-caption {
            color: #bdc3c7;
            font-size: 1em;
            line-height: 1.2;
            margin: 0 auto;
            padding: 0 12px;
        }

        h1 {
            font-size: 4em;
            line-height: 1.2;
            color: #f8f9fa;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .tagline {
            font-size: 1.2em;
            line-height: 1.2;
            color: #bdc3c7;
            margin-top: -20px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1em;
            line-height: 1.2;
            text-decoration: none;
            color: #174edb;
            background: #fff;
            border-radius: 0;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: none;
        }

        .btn:hover {
            background: #f5f7ff;
            color: #174edb;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        @media (max-height: 1000px) and (min-width: 701px) {
            h1 {
                margin-bottom: 18px;
            }

            .tagline {
                margin-bottom: 18px;
            }

            .buttons {
                margin-top: 15px;
            }
        }

        @media (max-width: 700px) {
            h1 {
                font-size: clamp(2.5rem, 13.5vw, 4em);
            }

            .clothing-gallery {
                gap: 8px;
            }

            .buttons {
                gap: 8px;
            }

            .btn {
                padding: 12px 8px;
                font-size: clamp(0.8rem, 4vw, 1.1em);
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <section id="intro-section" class="page-section intro-section">
            <div class="intro">
                <h1>David Curtis</h1>
                <p class="tagline">3D Hard Surface Artist. I create technical tools.<br>Design and AI-Assisted Product Visualization</p>
                <div class="buttons">
                    <a href="https://www.artstation.com/davidcurtis/" target="_blank" class="btn">3D Portfolio</a>
                    <a href="https://github.com/ovhensik" target="_blank" class="btn">Github</a>
                    <a href="David_Curtis_Resume.pdf" class="btn">Resume</a>
                </div>
            </div>
        </section>
        <section id="product-section" class="page-section product-section" aria-labelledby="product-title">
            <h2 id="product-title" class="project-title">Product Visualization</h2>
            <video class="project-video" width="1280" height="704" autoplay muted loop playsinline controls preload="metadata">
                <source src="ferrari-video.mp4" type="video/mp4">
            </video>
            <p class="project-caption">AI prompted with LTX 2.5 local model in ComfyUI and edited in FilmCraft</p>
        </section>
        <section id="red-jacket-section" class="page-section clothing-section" aria-labelledby="clothing-title">
            <h2 id="clothing-title" class="project-title">Clothing</h2>
            <div class="clothing-gallery">
                <button class="clothing-image-button" type="button">
                    <img src="jacket_red_02.jpg" alt="Red and white jacket displayed on a hanger">
                </button>
                <button class="clothing-image-button" type="button">
                    <img src="jacket_red_01.jpg" alt="Close-up of the white jacket with glossy red panels and a grid-pattern collar">
                </button>
                <video autoplay muted loop controls playsinline preload="metadata" aria-label="Red and white jacket video">
                    <source src="jacket_red_video.mp4" type="video/mp4">
                </video>
            </div>
        </section>
        <section id="clothing-section" class="page-section clothing-section" aria-label="Blue jacket project">
            <div class="clothing-gallery">
                <button class="clothing-image-button" type="button">
                    <img src="jacket_02.png" alt="Blue and navy jacket displayed on a hanger">
                </button>
                <button class="clothing-image-button" type="button">
                    <img src="jacket_01.png" alt="Close-up of the jacket's collar and patterned blue fabric">
                </button>
                <video autoplay muted loop controls playsinline preload="metadata">
                    <source src="jacket_video_01.mp4" type="video/mp4">
                </video>
            </div>
        </section>
    </main>
    <nav class="page-indicators" aria-label="Page navigation">
        <a class="page-indicator" href="#intro-section" aria-label="Introduction" aria-current="page"></a>
        <a class="page-indicator" href="#product-section" aria-label="Product Visualization"></a>
        <a class="page-indicator" href="#red-jacket-section" aria-label="Red jacket project"></a>
        <a class="page-indicator" href="#clothing-section" aria-label="Clothing"></a>
    </nav>
    <dialog class="image-dialog" aria-label="Enlarged clothing image">
        <button class="image-dialog-close" type="button">Close</button>
        <img alt="">
    </dialog>
    <script>
        const imageDialog = document.querySelector('.image-dialog');
        const enlargedImage = imageDialog.querySelector('img');

        document.querySelectorAll('.clothing-image-button').forEach((button) => {
            button.addEventListener('click', () => {
                const image = button.querySelector('img');
                enlargedImage.src = image.src;
                enlargedImage.alt = image.alt;
                imageDialog.showModal();
            });
        });

        imageDialog.querySelector('.image-dialog-close').addEventListener('click', () => {
            imageDialog.close();
        });

        imageDialog.addEventListener('click', (event) => {
            if (event.target === imageDialog) {
                imageDialog.close();
            }
        });

        const introSection = document.querySelector('.intro-section');
        let fadeFrame = null;
        const updateIntroFade = () => {
            if (fadeFrame !== null) {
                return;
            }

            fadeFrame = requestAnimationFrame(() => {
                const sectionTop = introSection.getBoundingClientRect().top;
                const sectionHeight = introSection.offsetHeight;
                const fadeProgress = Math.min(1, Math.max(0, -sectionTop / sectionHeight));
                introSection.style.setProperty('--intro-fade', fadeProgress);
                fadeFrame = null;
            });
        };

        window.addEventListener('scroll', updateIntroFade, { passive: true });
        window.addEventListener('resize', updateIntroFade);
        updateIntroFade();

        const pageIndicators = document.querySelectorAll('.page-indicator');
        const sectionObserver = new IntersectionObserver((entries) => {
            const currentSection = entries
                .filter((entry) => entry.isIntersecting)
                .sort((first, second) => second.intersectionRatio - first.intersectionRatio)[0];

            if (!currentSection) {
                return;
            }

            pageIndicators.forEach((indicator) => {
                if (indicator.hash === `#${currentSection.target.id}`) {
                    indicator.setAttribute('aria-current', 'page');
                } else {
                    indicator.removeAttribute('aria-current');
                }
            });
        }, { threshold: [0.5, 0.75, 1] });

        document.querySelectorAll('.page-section').forEach((section) => {
            sectionObserver.observe(section);
        });
    </script>
</body>
</html>
